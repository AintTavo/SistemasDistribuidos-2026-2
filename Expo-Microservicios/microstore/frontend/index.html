<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Microstore - Sistema de Pedidos</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen">
  <div id="toast-container" class="fixed top-4 right-4 z-50"></div>

  <nav class="bg-gradient-to-r from-indigo-600 to-purple-600 text-white shadow-xl">
    <div class="container mx-auto px-4 py-4">
      <div class="flex justify-between items-center">
        <div class="flex items-center gap-3">
          <span class="text-3xl">🍔</span>
          <div>
            <h1 class="text-2xl font-bold">Microstore</h1>
            <p class="text-xs text-indigo-200">Sistema de Pedidos Distribuido</p>
          </div>
        </div>
        <div class="flex items-center gap-4">
          <button onclick="refreshAll()" class="bg-white/20 hover:bg-white/30 px-4 py-2 rounded-lg transition flex items-center gap-2">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
            Actualizar
          </button>
        </div>
      </div>
    </div>
  </nav>

  <div class="container mx-auto px-4 py-6">
    <div id="debug" class="hidden mb-4 p-4 bg-gray-800 text-green-400 rounded-lg text-sm font-mono overflow-x-auto"></div>
    
    <div class="grid lg:grid-cols-3 gap-6">
      <div class="lg:col-span-1 space-y-6">
        <div class="bg-white rounded-xl shadow-md p-6">
          <div class="flex justify-between items-center mb-4">
            <h2 class="text-lg font-semibold text-gray-800">📋 Menú</h2>
            <button onclick="openModal('addProductModal')" class="text-sm bg-indigo-100 text-indigo-700 px-3 py-1 rounded-lg hover:bg-indigo-200 transition">
              + Agregar
            </button>
          </div>
          <div id="productsList" class="space-y-2 max-h-80 overflow-y-auto">
            <p class="text-gray-500 text-center py-4">Cargando...</p>
          </div>
        </div>

        <div class="bg-white rounded-xl shadow-md p-6">
          <h2 class="text-lg font-semibold text-gray-800 mb-4">🛒 Carrito</h2>
          <div id="cartItems" class="space-y-2 mb-4 max-h-48 overflow-y-auto">
            <p class="text-gray-400 text-sm text-center py-4">Sin productos</p>
          </div>
          <div class="border-t pt-4">
            <div class="flex justify-between text-lg font-bold">
              <span>Total:</span>
              <span id="cartTotal" class="text-green-600">$0</span>
            </div>
          </div>
        </div>
      </div>

      <div class="lg:col-span-2 space-y-6">
        <div class="bg-white rounded-xl shadow-md p-6">
          <h2 class="text-lg font-semibold text-gray-800 mb-4">📝 Nuevo Pedido</h2>
          <form id="orderForm" class="space-y-4">
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Cliente</label>
              <input type="text" id="customerName" required placeholder="Nombre del cliente"
                class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-indigo-500">
            </div>
            <div class="grid grid-cols-2 gap-4">
              <button type="submit" class="bg-indigo-600 text-white py-3 px-4 rounded-lg hover:bg-indigo-700 transition font-medium">
                ✅ Crear Pedido
              </button>
              <button type="button" onclick="clearCart()" class="bg-gray-200 text-gray-700 py-3 px-4 rounded-lg hover:bg-gray-300 transition">
                🗑️ Limpiar
              </button>
            </div>
          </form>
        </div>

        <div class="bg-white rounded-xl shadow-md p-6">
          <div class="flex justify-between items-center mb-4">
            <h2 class="text-lg font-semibold text-gray-800">📦 Pedidos</h2>
            <span id="ordersCount" class="text-sm text-gray-500">0 pedidos</span>
          </div>
          <div id="ordersList" class="space-y-4 max-h-96 overflow-y-auto">
            <p class="text-gray-500 text-center py-4">Cargando...</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="addProductModal" class="fixed inset-0 bg-black/50 hidden items-center justify-center z-50">
    <div class="bg-white rounded-2xl shadow-2xl p-6 w-full max-w-md mx-4">
      <div class="flex justify-between items-center mb-4">
        <h3 class="text-xl font-semibold text-gray-800">➕ Agregar Producto</h3>
        <button onclick="closeModal('addProductModal')" class="text-gray-400 hover:text-gray-600 text-2xl">&times;</button>
      </div>
      <form id="addProductForm" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Nombre</label>
          <input type="text" id="productName" required placeholder="Ej: Burrito"
            class="w-full border border-gray-300 rounded-lg px-4 py-2">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Precio ($)</label>
          <input type="number" id="productPrice" required min="1" placeholder="0"
            class="w-full border border-gray-300 rounded-lg px-4 py-2">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Categoría</label>
          <select id="productCategory" required class="w-full border border-gray-300 rounded-lg px-4 py-2">
            <option value="">Seleccionar...</option>
            <option value="Comida">🍔 Comida</option>
            <option value="Bebida">🥤 Bebida</option>
            <option value="Postre">🍰 Postre</option>
          </select>
        </div>
        <div class="flex gap-3 pt-2">
          <button type="submit" class="flex-1 bg-indigo-600 text-white py-3 rounded-lg hover:bg-indigo-700 transition font-medium">
            💾 Guardar
          </button>
          <button type="button" onclick="closeModal('addProductModal')" class="flex-1 bg-gray-200 text-gray-700 py-3 rounded-lg hover:bg-gray-300 transition">
            Cancelar
          </button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const API = 'http://localhost:3003/api';
    let products = [];
    let cart = [];
    let debugMode = false;

    function debug(msg, data = null) {
      const debugEl = document.getElementById('debug');
      const timestamp = new Date().toLocaleTimeString();
      let msgStr = `[${timestamp}] ${msg}`;
      if (data) msgStr += ` ${JSON.stringify(data)}`;
      debugEl.innerHTML += msgStr + '<br>';
      console.log(msgStr);
    }

    function toggleDebug() {
      const debugEl = document.getElementById('debug');
      debugMode = !debugMode;
      debugEl.classList.toggle('hidden', !debugMode);
      if (debugMode) debug('Debug mode enabled');
    }

    function showToast(message, type = 'success') {
      const container = document.getElementById('toast-container');
      const colors = { success: 'bg-green-500', error: 'bg-red-500', warning: 'bg-yellow-500', info: 'bg-blue-500' };
      const icons = { success: '✓', error: '✕', warning: '⚠', info: 'ℹ' };
      
      const toast = document.createElement('div');
      toast.className = `${colors[type]} text-white px-6 py-3 rounded-lg shadow-lg mb-3 flex items-center gap-3 transition-all duration-300 translate-x-full opacity-0`;
      toast.innerHTML = `<span class="text-xl font-bold">${icons[type]}</span><span class="font-medium">${message}</span>`;
      
      container.appendChild(toast);
      setTimeout(() => toast.classList.remove('translate-x-full', 'opacity-0'), 10);
      setTimeout(() => {
        toast.classList.add('translate-x-full', 'opacity-0');
        setTimeout(() => toast.remove(), 300);
      }, 3000);
    }

    function openModal(id) {
      document.getElementById(id).classList.remove('hidden');
      document.getElementById(id).classList.add('flex');
    }

    function closeModal(id) {
      document.getElementById(id).classList.add('hidden');
      document.getElementById(id).classList.remove('flex');
    }

    async function loadProducts() {
      debug('LOAD PRODUCTS: Fetching...');
      try {
        const res = await fetch(`${API}/products`);
        debug('LOAD PRODUCTS: Response status', res.status);
        
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        
        const data = await res.json();
        debug('LOAD PRODUCTS: Data received', { count: data.length });
        
        products = data;
        renderProducts();
        showToast('Productos cargados', 'success');
      } catch (e) {
        debug('LOAD PRODUCTS: ERROR', e.message);
        showToast('Error al cargar productos: ' + e.message, 'error');
      }
    }

    function renderProducts() {
      const container = document.getElementById('productsList');
      const categories = [...new Set(products.map(p => p.category))];
      
      let html = '';
      categories.forEach(cat => {
        const catProducts = products.filter(p => p.category === cat);
        const icon = cat === 'Comida' ? '🍔' : cat === 'Bebida' ? '🥤' : '🍰';
        html += `<div class="mb-3">
          <p class="text-xs font-semibold text-gray-500 uppercase mb-2">${icon} ${cat}</p>
          ${catProducts.map(p => `
            <div class="flex justify-between items-center p-2 rounded-lg hover:bg-gray-50">
              <div class="flex items-center gap-2">
                <button onclick="addToCart(${p.id})" class="text-indigo-600 hover:bg-indigo-100 p-1 rounded">➕</button>
                <span class="text-sm text-gray-800">${p.name}</span>
                <span class="text-xs text-gray-400">#${p.id}</span>
              </div>
              <span class="text-sm font-bold text-green-600">$${p.price}</span>
            </div>
          `).join('')}
        </div>`;
      });
      container.innerHTML = products.length ? html : '<p class="text-gray-500">No hay productos</p>';
    }

    function addToCart(productId) {
      const existing = cart.find(item => item.productId === productId);
      if (existing) {
        existing.quantity++;
      } else {
        const product = products.find(p => p.id === productId);
        cart.push({ productId, name: product.name, price: product.price, quantity: 1 });
      }
      renderCart();
      showToast('Agregado al carrito', 'success');
    }

    function removeFromCart(productId) {
      cart = cart.filter(item => item.productId !== productId);
      renderCart();
    }

    function updateQuantity(productId, delta) {
      const item = cart.find(i => i.productId === productId);
      if (item) {
        item.quantity += delta;
        if (item.quantity <= 0) removeFromCart(productId);
        else renderCart();
      }
    }

    function renderCart() {
      const container = document.getElementById('cartItems');
      const totalEl = document.getElementById('cartTotal');
      
      if (!cart.length) {
        container.innerHTML = '<p class="text-gray-400 text-sm text-center py-4">Sin productos</p>';
        totalEl.textContent = '$0';
        return;
      }

      container.innerHTML = cart.map(item => `
        <div class="flex justify-between items-center p-2 bg-gray-50 rounded-lg">
          <div class="flex-1">
            <p class="text-sm font-medium">${item.name}</p>
            <p class="text-xs text-gray-500">$${item.price} c/u</p>
          </div>
          <div class="flex items-center gap-2">
            <button onclick="updateQuantity(${item.productId}, -1)" class="w-6 h-6 bg-gray-200 rounded">-</button>
            <span class="text-sm font-medium w-6 text-center">${item.quantity}</span>
            <button onclick="updateQuantity(${item.productId}, 1)" class="w-6 h-6 bg-gray-200 rounded">+</button>
            <button onclick="removeFromCart(${item.productId})" class="text-red-500 ml-2 text-lg">&times;</button>
          </div>
        </div>
      `).join('');

      const total = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
      totalEl.textContent = `$${total}`;
    }

    function clearCart() {
      cart = [];
      renderCart();
      showToast('Carrito limpiado', 'info');
    }

    async function loadOrders() {
      debug('LOAD ORDERS: Fetching...');
      try {
        const res = await fetch(`${API}/orders`);
        debug('LOAD ORDERS: Response status', res.status);
        
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        
        const data = await res.json();
        debug('LOAD ORDERS: Data received', { count: data.length });
        
        renderOrders(data);
      } catch (e) {
        debug('LOAD ORDERS: ERROR', e.message);
        showToast('Error al cargar pedidos: ' + e.message, 'error');
      }
    }

    function getStatusBadge(status) {
      const styles = {
        'pendiente': 'bg-yellow-100 text-yellow-800',
        'preparando': 'bg-blue-100 text-blue-800',
        'completado': 'bg-green-100 text-green-800',
        'cancelado': 'bg-red-100 text-red-800'
      };
      return `<span class="px-2 py-1 rounded-full text-xs font-medium ${styles[status] || 'bg-gray-100'}">${status}</span>`;
    }

    function renderOrders(orders) {
      const container = document.getElementById('ordersList');
      document.getElementById('ordersCount').textContent = `${orders.length} pedido${orders.length !== 1 ? 's' : ''}`;
      
      if (!orders.length) {
        container.innerHTML = '<p class="text-gray-500 text-center py-4">No hay pedidos aún</p>';
        return;
      }

      container.innerHTML = orders.map(o => `
        <div class="border rounded-lg p-4 hover:shadow-md">
          <div class="flex justify-between items-start mb-2">
            <div>
              <span class="font-semibold text-lg">#${o.id}</span>
              <span class="text-gray-600 ml-2">${o.customer}</span>
            </div>
            <div class="text-right">
              <span class="font-bold text-green-600 text-lg">$${o.total}</span>
              ${getStatusBadge(o.status)}
            </div>
          </div>
          <div class="text-sm text-gray-600 mb-3">
            ${o.items?.map(i => `• ${i.product?.name || 'Producto'} x${i.quantity}`).join(', ') || ''}
          </div>
          <div class="flex gap-2">
            ${o.status === 'pendiente' ? `<button onclick="updateOrderStatus(${o.id}, 'preparando')" class="px-3 py-1 bg-blue-500 text-white text-xs rounded">⏳ Preparar</button>` : ''}
            ${o.status !== 'completado' && o.status !== 'cancelado' ? `<button onclick="updateOrderStatus(${o.id}, 'completado')" class="px-3 py-1 bg-green-500 text-white text-xs rounded">✓ Completar</button>` : ''}
            ${o.status !== 'cancelado' && o.status !== 'completado' ? `<button onclick="updateOrderStatus(${o.id}, 'cancelado')" class="px-3 py-1 bg-red-500 text-white text-xs rounded">✕ Cancelar</button>` : ''}
          </div>
        </div>
      `).join('');
    }

    async function updateOrderStatus(orderId, status) {
      try {
        const res = await fetch(`${API}/orders/${orderId}/status`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ status })
        });
        if (res.ok) {
          showToast(`Pedido #${orderId} → ${status}`, 'success');
          await loadOrders();
        } else {
          const err = await res.json();
          showToast(err.error || 'Error', 'error');
        }
      } catch (e) {
        showToast('Error de conexión', 'error');
      }
    }

    document.getElementById('orderForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const customer = document.getElementById('customerName').value.trim();
      if (!customer || !cart.length) {
        showToast('Datos inválidos', 'warning');
        return;
      }

      const items = cart.map(item => ({ productId: item.productId, quantity: item.quantity }));

      debug('CREATE ORDER: Sending', { customer, items });

      try {
        const res = await fetch(`${API}/orders`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ customer, items })
        });

        debug('CREATE ORDER: Response', res.status);

        const result = await res.json();
        debug('CREATE ORDER: Result', result);

        if (res.ok) {
          document.getElementById('customerName').value = '';
          clearCart();
          await loadOrders();
          showToast(`✅ Pedido #${result.id} creado!`, 'success');
        } else {
          showToast(result.error || 'Error al crear', 'error');
        }
      } catch (e) {
        debug('CREATE ORDER: ERROR', e.message);
        showToast('Error: ' + e.message, 'error');
      }
    });

    document.getElementById('addProductForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const name = document.getElementById('productName').value.trim();
      const price = parseFloat(document.getElementById('productPrice').value);
      const category = document.getElementById('productCategory').value;

      debug('ADD PRODUCT: Sending', { name, price, category });

      try {
        const res = await fetch(`${API}/products`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, price, category })
        });

        debug('ADD PRODUCT: Response', res.status);

        const result = await res.json();
        debug('ADD PRODUCT: Result', result);

        if (res.ok) {
          closeModal('addProductModal');
          document.getElementById('addProductForm').reset();
          await loadProducts();
          showToast(`✅ "${result.name}" agregado!`, 'success');
        } else {
          showToast(result.error || 'Error al agregar', 'error');
        }
      } catch (e) {
        debug('ADD PRODUCT: ERROR', e.message);
        showToast('Error: ' + e.message, 'error');
      }
    });

    async function refreshAll() {
      showToast('Actualizando...', 'info');
      await Promise.all([loadProducts(), loadOrders()]);
      showToast('Datos actualizados', 'success');
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        document.querySelectorAll('.modal:not(.hidden)').forEach(m => closeModal(m.id));
      }
    });

    loadProducts();
    loadOrders();
  </script>
</body>
</html>
