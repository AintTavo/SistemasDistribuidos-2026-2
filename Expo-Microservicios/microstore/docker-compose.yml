services:
  products:
    build:
      context: ./products-service
      dockerfile: Dockerfile
    container_name: microstore-products
    ports:
      - "3001:3001"
    volumes:
      - products_data:/app/data
    networks:
      - microstore-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3001/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  orders:
    build:
      context: ./orders-service
      dockerfile: Dockerfile
    container_name: microstore-orders
    ports:
      - "3002:3002"
    volumes:
      - orders_data:/app/data
    networks:
      - microstore-network
    depends_on:
      products:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3002/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: microstore-gateway
    ports:
      - "3003:3003"
    networks:
      - microstore-network
    depends_on:
      products:
        condition: service_healthy
      orders:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3003/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: microstore-frontend
    ports:
      - "8080:80"
    networks:
      - microstore-network
    depends_on:
      gateway:
        condition: service_started

volumes:
  products_data:
  orders_data:

networks:
  microstore-network:
    driver: bridge