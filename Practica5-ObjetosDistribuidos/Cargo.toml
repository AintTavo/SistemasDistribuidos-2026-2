[package]
name        = "Practica5-ObjetosDistribuidos"
version     = "0.1.0"
edition     = "2021"

[[bin]]
name = "coordinator"
path = "src/coordinator.rs"

[[bin]]
name = "server"
path = "src/server.rs"

[[bin]]
name = "client"
path = "src/client.rs"

[[bin]]
name = "orb_broker"
path = "src/orb_broker.rs"

[dependencies]
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
rand        = "0.9"
tungstenite = "0.24"