<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dungeon ORB — Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Cinzel:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:        #0a0c10;
    --bg2:       #0f1318;
    --bg3:       #151b22;
    --border:    #1e2a38;
    --border2:   #2a3a50;
    --gold:      #c8a84b;
    --gold2:     #e8c96a;
    --red:       #c0392b;
    --red2:      #e74c3c;
    --green:     #1a7a4a;
    --green2:    #27ae60;
    --blue:      #1a4f7a;
    --blue2:     #2980b9;
    --purple:    #5b2d8e;
    --purple2:   #8e44ad;
    --orb:       #ff6b35;
    --orb2:      #ff9a5c;
    --text:      #b0bec5;
    --text2:     #78909c;
    --mono:      'Share Tech Mono', monospace;
    --serif:     'Cinzel', serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--mono);
    font-size: 13px;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ─── scanline overlay ─────────────────── */
  body::before {
    content: '';
    position: fixed; inset: 0;
    background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,.07) 2px, rgba(0,0,0,.07) 4px);
    pointer-events: none; z-index: 9999;
  }

  /* ─── Header ───────────────────────────── */
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 24px;
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 100;
  }
  .logo {
    font-family: var(--serif);
    font-size: 20px; letter-spacing: 3px;
    color: var(--gold);
    text-shadow: 0 0 20px rgba(200,168,75,.4);
  }
  .logo span { color: var(--orb); }

  .header-stats {
    display: flex; gap: 24px; align-items: center;
  }
  .hstat { text-align: center; }
  .hstat-val {
    font-size: 22px; font-weight: bold;
    color: var(--gold2);
    transition: color .3s;
  }
  .hstat-val.flash { color: var(--orb2); }
  .hstat-lbl { font-size: 10px; color: var(--text2); letter-spacing: 1px; text-transform: uppercase; }

  .ws-dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: var(--red2); transition: background .3s;
  }
  .ws-dot.connected { background: var(--green2); box-shadow: 0 0 8px var(--green2); }

  /* ─── Layout ───────────────────────────── */
  .layout {
    display: grid;
    grid-template-columns: 1fr 340px;
    grid-template-rows: auto 1fr;
    gap: 16px;
    padding: 16px;
    height: calc(100vh - 57px);
  }

  /* ─── Panel base ───────────────────────── */
  .panel {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 4px;
    overflow: hidden;
  }
  .panel-header {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 14px;
    background: var(--bg3);
    border-bottom: 1px solid var(--border);
    font-size: 11px; letter-spacing: 2px; text-transform: uppercase;
    color: var(--text2);
  }
  .panel-header .dot { width: 6px; height: 6px; border-radius: 50%; }
  .dot-gold   { background: var(--gold); }
  .dot-orb    { background: var(--orb); }
  .dot-blue   { background: var(--blue2); }
  .dot-green  { background: var(--green2); }
  .dot-red    { background: var(--red2); }

  /* ─── Board ────────────────────────────── */
  .board-wrap {
    grid-column: 1; grid-row: 1 / 3;
    display: flex; flex-direction: column;
  }
  .board-container {
    flex: 1; padding: 16px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  #board-grid {
    display: grid;
    grid-template-columns: repeat(10, 1fr);
    gap: 3px;
    width: min(100%, 580px);
  }
  .cell {
    aspect-ratio: 1;
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 2px;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px;
    position: relative;
    transition: background .15s, border-color .15s, transform .1s;
    cursor: default;
  }
  .cell.occupied {
    background: #0d1f0f;
    border-color: var(--green);
  }
  .cell.zone-0 { border-top: 2px solid #1a4f7a44; }
  .cell.zone-1 { border-top: 2px solid #5b2d8e44; }
  .cell.zone-2 { border-top: 2px solid #7a3a1a44; }
  .cell.zone-3 { border-top: 2px solid #1a7a4a44; }

  .cell.flash-attack {
    background: #3a0a0a !important;
    border-color: var(--red2) !important;
    transform: scale(1.08);
  }
  .cell.flash-orb {
    background: #2a1a08 !important;
    border-color: var(--orb2) !important;
    transform: scale(1.12);
    box-shadow: 0 0 12px var(--orb);
  }
  .cell:hover { border-color: var(--border2); }

  .hero-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--green2);
    box-shadow: 0 0 6px var(--green2);
  }
  .hero-dot.action-attack  { background: var(--red2);    box-shadow: 0 0 8px var(--red2); }
  .hero-dot.action-potion  { background: var(--blue2);   box-shadow: 0 0 8px var(--blue2); }
  .hero-dot.action-move    { background: var(--green2);  box-shadow: 0 0 4px var(--green2); }

  .cell-tooltip {
    display: none;
    position: absolute;
    bottom: calc(100% + 6px); left: 50%;
    transform: translateX(-50%);
    background: var(--bg3);
    border: 1px solid var(--border2);
    border-radius: 3px;
    padding: 6px 10px;
    white-space: nowrap;
    font-size: 11px;
    z-index: 200;
    pointer-events: none;
  }
  .cell:hover .cell-tooltip { display: block; }

  /* Zone labels */
  .zone-overlay {
    position: absolute; top: 2px; left: 3px;
    font-size: 9px; color: rgba(255,255,255,.25);
    pointer-events: none;
  }

  /* ─── Board coords ─────────────────────── */
  .board-axis {
    display: grid;
    grid-template-columns: repeat(10, 1fr);
    gap: 3px;
    width: min(100%, 580px);
    margin-bottom: 3px;
  }
  .axis-label {
    text-align: center; font-size: 10px; color: var(--text2);
  }

  /* ─── Right column ─────────────────────── */
  .right-col {
    grid-column: 2; grid-row: 1 / 3;
    display: flex; flex-direction: column; gap: 12px;
    overflow: hidden;
  }

  /* ─── ORB Stats ────────────────────────── */
  .orb-stats {
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 8px; padding: 12px;
  }
  .stat-box {
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 3px;
    padding: 10px;
    text-align: center;
  }
  .stat-val {
    font-size: 26px;
    color: var(--orb2);
    transition: transform .2s;
  }
  .stat-val.bump { transform: scale(1.3); }
  .stat-lbl { font-size: 10px; color: var(--text2); margin-top: 2px; letter-spacing: 1px; }

  /* ─── Servers ──────────────────────────── */
  .server-list { padding: 10px; display: flex; flex-direction: column; gap: 6px; }
  .server-card {
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 3px;
    padding: 8px 12px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .server-card.alive { border-left: 3px solid var(--green2); }
  .server-card.dead  { border-left: 3px solid var(--red2); opacity: .6; }
  .srv-name { color: var(--gold); font-size: 12px; }
  .srv-zone { color: var(--text2); font-size: 11px; }
  .srv-count {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 2px;
    padding: 2px 8px;
    font-size: 12px; color: var(--green2);
  }

  /* ─── ORB Events feed ──────────────────── */
  .orb-feed {
    flex: 1; padding: 10px;
    overflow-y: auto;
    display: flex; flex-direction: column; gap: 4px;
  }
  .orb-feed::-webkit-scrollbar { width: 4px; }
  .orb-feed::-webkit-scrollbar-track { background: var(--bg); }
  .orb-feed::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

  .orb-event {
    display: flex; align-items: flex-start; gap: 8px;
    padding: 7px 10px;
    background: var(--bg3);
    border-radius: 3px;
    border-left: 3px solid transparent;
    animation: slideIn .25s ease;
    font-size: 11px;
  }
  @keyframes slideIn { from { opacity: 0; transform: translateX(10px); } to { opacity: 1; transform: none; } }

  .orb-event.cross { border-left-color: var(--orb); }
  .orb-event.local { border-left-color: var(--blue2); }
  .orb-event.kill  { border-left-color: var(--red2); background: #1a0808; }

  .evt-icon { font-size: 14px; flex-shrink: 0; }
  .evt-body { flex: 1; line-height: 1.6; }
  .evt-attacker { color: var(--gold2); }
  .evt-target   { color: var(--text); }
  .evt-dmg      { color: var(--red2); font-weight: bold; }
  .evt-route {
    font-size: 10px; padding: 1px 5px; border-radius: 2px; margin-left: 4px;
    vertical-align: middle;
  }
  .evt-route.cross { background: rgba(255,107,53,.15); color: var(--orb2); }
  .evt-route.local { background: rgba(41,128,185,.15); color: var(--blue2); }
  .evt-tick { font-size: 10px; color: var(--text2); margin-left: auto; flex-shrink: 0; }

  /* ─── Event log ────────────────────────── */
  .event-log {
    grid-column: 1; grid-row: 2;
    display: none; /* aparece solo si el layout lo necesita */
  }

  /* ─── Empty state ──────────────────────── */
  .empty-state {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    height: 100%; gap: 8px; color: var(--text2); font-size: 12px;
  }
  .empty-state .glyph { font-size: 32px; opacity: .3; }

  /* ─── Zone legend ──────────────────────── */
  .zone-legend {
    display: flex; gap: 12px; padding: 8px 14px;
    border-top: 1px solid var(--border);
    flex-wrap: wrap;
  }
  .zone-legend-item { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--text2); }
  .zone-legend-swatch { width: 12px; height: 12px; border-radius: 1px; }

  /* ─── Responsive ────────────────────────── */
  @media (max-width: 900px) {
    .layout { grid-template-columns: 1fr; grid-template-rows: auto auto 1fr; height: auto; }
    .board-wrap  { grid-column: 1; grid-row: 1; }
    .right-col   { grid-column: 1; grid-row: 2; max-height: 60vh; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">DUNGEON <span>ORB</span></div>
  <div class="header-stats">
    <div class="hstat">
      <div class="hstat-val" id="h-total">0</div>
      <div class="hstat-lbl">invocaciones ORB</div>
    </div>
    <div class="hstat">
      <div class="hstat-val" id="h-cross">0</div>
      <div class="hstat-lbl">cross-zona</div>
    </div>
    <div class="hstat">
      <div class="hstat-val" id="h-heroes">0</div>
      <div class="hstat-lbl">héroes vivos</div>
    </div>
    <div class="hstat">
      <div class="hstat-val" id="h-tick">—</div>
      <div class="hstat-lbl">tick</div>
    </div>
    <div title="Estado WebSocket" id="ws-dot" class="ws-dot"></div>
  </div>
</header>

<div class="layout">

  <!-- ─── Tablero ─────────────────────────── -->
  <div class="panel board-wrap">
    <div class="panel-header">
      <span class="dot dot-gold"></span>
      TABLERO 10×10
      <span style="margin-left:auto;font-size:10px" id="board-tick"></span>
    </div>
    <div class="board-container">
      <div class="board-axis" id="axis-x"></div>
      <div id="board-grid"></div>
    </div>
    <div class="zone-legend" id="zone-legend"></div>
  </div>

  <!-- ─── Columna derecha ──────────────────── -->
  <div class="right-col">

    <!-- Servidores -->
    <div class="panel" style="flex-shrink:0">
      <div class="panel-header"><span class="dot dot-green"></span>SERVIDORES DE ZONA</div>
      <div class="server-list" id="server-list">
        <div class="empty-state"><span class="glyph">⬡</span>Sin servidores</div>
      </div>
    </div>

    <!-- Stats ORB -->
    <div class="panel" style="flex-shrink:0">
      <div class="panel-header"><span class="dot dot-orb"></span>ORB — OBJETO DISTRIBUIDO (ATTACK)</div>
      <div class="orb-stats">
        <div class="stat-box"><div class="stat-val" id="s-total">0</div><div class="stat-lbl">Total llamadas</div></div>
        <div class="stat-box"><div class="stat-val" id="s-cross" style="color:var(--orb2)">0</div><div class="stat-lbl">Cross-zona</div></div>
        <div class="stat-box"><div class="stat-val" id="s-local" style="color:var(--blue2)">0</div><div class="stat-lbl">Local</div></div>
        <div class="stat-box"><div class="stat-val" id="s-miss"  style="color:var(--text2)">0</div><div class="stat-lbl">Misses</div></div>
      </div>
    </div>

    <!-- Feed de eventos ORB -->
    <div class="panel" style="flex:1;display:flex;flex-direction:column;min-height:0">
      <div class="panel-header"><span class="dot dot-orb"></span>INVOCACIONES ORB EN VIVO</div>
      <div class="orb-feed" id="orb-feed">
        <div class="empty-state"><span class="glyph">◈</span>Esperando ataques...</div>
      </div>
    </div>

  </div>
</div>

<script>
// ─── Estado global ────────────────────────────────────────────
let state = null;
let prevStats = { total: 0, cross: 0 };
const ZONE_COLORS = ['#1a4f7a', '#5b2d8e', '#7a3a1a', '#1a7a4a', '#7a1a4a', '#4a7a1a'];
const ZONE_NAMES  = ['Zona A','Zona B','Zona C','Zona D','Zona E','Zona F'];
let lastOrbCount  = 0;
let flashCells    = new Map(); // key → timeout

// ─── WebSocket ────────────────────────────────────────────────
function connect() {
  const ws = new WebSocket('ws://127.0.0.1:9000');
  const dot = document.getElementById('ws-dot');

  ws.onopen = () => {
    dot.classList.add('connected');
    console.log('[WS] conectado');
  };
  ws.onmessage = (e) => {
    try { state = JSON.parse(e.data); render(state); } catch(err) { console.error(err); }
  };
  ws.onclose = () => {
    dot.classList.remove('connected');
    setTimeout(connect, 2000);
  };
  ws.onerror = () => ws.close();
}

// ─── Render principal ─────────────────────────────────────────
function render(s) {
  renderHeader(s);
  renderBoard(s);
  renderServers(s);
  renderOrbStats(s);
  renderOrbFeed(s);
}

// ─── Header ───────────────────────────────────────────────────
function renderHeader(s) {
  const heroes = s.board.flat().filter(c => c !== null).length;
  setText('h-total', s.orb_stats.total_invocations);
  setText('h-cross', s.orb_stats.cross_zone_hits);
  setText('h-heroes', heroes);
  setText('h-tick', s.tick);
  setText('board-tick', 'tick #' + s.tick);

  // Flash si aumentó invocaciones
  if (s.orb_stats.total_invocations > prevStats.total) {
    flashEl('h-total'); flashEl('h-cross');
    prevStats.total = s.orb_stats.total_invocations;
    prevStats.cross = s.orb_stats.cross_zone_hits;
  }
}

// ─── Tablero ──────────────────────────────────────────────────
function renderBoard(s) {
  const grid   = document.getElementById('board-grid');
  const axisX  = document.getElementById('axis-x');
  const legend = document.getElementById('zone-legend');

  // Construir eje X (primera vez)
  if (!axisX.children.length) {
    for (let c = 0; c < 10; c++) {
      const el = document.createElement('div');
      el.className = 'axis-label'; el.textContent = c;
      axisX.appendChild(el);
    }
  }

  // Mapa zona → color
  const zoneMap = buildZoneMap(s.servers);

  // Leyenda de zonas
  legend.innerHTML = '';
  s.servers.forEach((srv, i) => {
    const col = ZONE_COLORS[i % ZONE_COLORS.length];
    const item = document.createElement('div');
    item.className = 'zone-legend-item';
    item.innerHTML = `<div class="zone-legend-swatch" style="background:${col}22;border:1px solid ${col}"></div>
      <span>Srv-${srv.id+1} ${ZONE_NAMES[i]||''} (${srv.zone.row_start}-${srv.zone.row_end})</span>`;
    legend.appendChild(item);
  });

  // Crear/actualizar celdas
  if (grid.children.length !== 100) {
    grid.innerHTML = '';
    for (let r = 0; r < 10; r++) {
      for (let c = 0; c < 10; c++) {
        const cell = document.createElement('div');
        cell.className = 'cell';
        cell.id = `cell-${r}-${c}`;
        const dot = document.createElement('div');
        dot.className = 'hero-dot'; dot.style.display = 'none';
        const tip = document.createElement('div');
        tip.className = 'cell-tooltip';
        const zo  = document.createElement('div');
        zo.className = 'zone-overlay';
        cell.appendChild(dot);
        cell.appendChild(tip);
        cell.appendChild(zo);
        grid.appendChild(cell);
      }
    }
  }

  // Actualizar celdas
  for (let r = 0; r < 10; r++) {
    for (let c = 0; c < 10; c++) {
      const cell = document.getElementById(`cell-${r}-${c}`);
      const hero = s.board[r] && s.board[r][c];
      const dot  = cell.querySelector('.hero-dot');
      const tip  = cell.querySelector('.cell-tooltip');
      const zo   = cell.querySelector('.zone-overlay');

      // Zona del servidor
      const zi = zoneMap[r];
      const zcol = zi !== undefined ? ZONE_COLORS[zi % ZONE_COLORS.length] : 'transparent';
      cell.style.borderTop = `2px solid ${zcol}44`;

      if (hero) {
        cell.classList.add('occupied');
        dot.style.display = 'block';
        dot.className = 'hero-dot action-' + (hero.action || 'move');
        const hp_pct = Math.round(hero.life / hero.max_life * 100);
        tip.innerHTML = `<b style="color:var(--gold2)">Héroe #${hero.id+1}</b><br>HP: ${hero.life}/${hero.max_life} (${hp_pct}%)<br>Pociones: ${hero.potions}<br>Acción: ${hero.action}`;
        zo.textContent = hero.id+1;
      } else {
        cell.classList.remove('occupied');
        dot.style.display = 'none';
        tip.innerHTML = `(${r},${c})`;
        zo.textContent = '';
      }
    }
  }

  // Flashear celdas de últimos ataques ORB
  if (s.orb_events && s.orb_events.length > lastOrbCount) {
    const newEvts = s.orb_events.slice(lastOrbCount);
    newEvts.forEach(evt => {
      const key = `${evt.target_row}-${evt.target_col}`;
      flashCell(evt.target_row, evt.target_col, evt.routing === 'cross_zone' ? 'flash-orb' : 'flash-attack');
    });
    lastOrbCount = s.orb_events.length;
  }
}

function buildZoneMap(servers) {
  const map = {};
  servers.forEach((srv, i) => {
    for (let r = srv.zone.row_start; r <= srv.zone.row_end; r++) map[r] = i;
  });
  return map;
}

function flashCell(r, c, cls) {
  const cell = document.getElementById(`cell-${r}-${c}`);
  if (!cell) return;
  const key = `${r}-${c}`;
  if (flashCells.has(key)) clearTimeout(flashCells.get(key));
  cell.classList.add(cls);
  const t = setTimeout(() => { cell.classList.remove(cls); flashCells.delete(key); }, 600);
  flashCells.set(key, t);
}

// ─── Servidores ───────────────────────────────────────────────
function renderServers(s) {
  const list = document.getElementById('server-list');
  if (!s.servers.length) {
    list.innerHTML = '<div class="empty-state"><span class="glyph">⬡</span>Sin servidores</div>';
    return;
  }
  list.innerHTML = '';
  s.servers.forEach((srv, i) => {
    const col = ZONE_COLORS[i % ZONE_COLORS.length];
    const card = document.createElement('div');
    card.className = 'server-card ' + (srv.alive ? 'alive' : 'dead');
    card.style.borderLeftColor = col;
    card.innerHTML = `
      <div>
        <div class="srv-name">Servidor ${srv.id+1}</div>
        <div class="srv-zone" style="color:${col}88">filas ${srv.zone.row_start}–${srv.zone.row_end} &nbsp;·&nbsp; ${srv.tcp_addr||'?'}</div>
        <div class="srv-zone">skeleton :${(7878 + srv.id) + 100}</div>
      </div>
      <div class="srv-count">${srv.client_count} héroes</div>`;
    list.appendChild(card);
  });
}

// ─── ORB Stats ────────────────────────────────────────────────
function renderOrbStats(s) {
  const st = s.orb_stats;
  updateStat('s-total', st.total_invocations);
  updateStat('s-cross', st.cross_zone_hits);
  updateStat('s-local', st.local_hits);
  updateStat('s-miss',  st.misses);
}

function updateStat(id, val) {
  const el = document.getElementById(id);
  if (!el) return;
  const prev = parseInt(el.dataset.prev || '0');
  if (val !== prev) {
    el.textContent = val;
    el.dataset.prev = val;
    el.classList.add('bump');
    setTimeout(() => el.classList.remove('bump'), 300);
  }
}

// ─── ORB Feed ─────────────────────────────────────────────────
function renderOrbFeed(s) {
  const feed = document.getElementById('orb-feed');
  if (!s.orb_events || !s.orb_events.length) {
    feed.innerHTML = '<div class="empty-state"><span class="glyph">◈</span>Esperando ataques...</div>';
    return;
  }
  const existing = feed.querySelectorAll('.orb-event').length;
  const total    = s.orb_events.length;
  if (existing === total) return;

  // Limpiar empty state
  const empty = feed.querySelector('.empty-state');
  if (empty) empty.remove();

  // Agregar solo nuevos eventos
  const newEvts = s.orb_events.slice(existing);
  newEvts.forEach(evt => {
    const isCross = evt.routing === 'cross_zone';
    const isKill  = evt.died;
    const div = document.createElement('div');
    div.className = 'orb-event ' + (isKill ? 'kill' : isCross ? 'cross' : 'local');
    const icon = isKill ? '💀' : isCross ? '🌐' : '⚔️';
    const routeLabel = `<span class="evt-route ${isCross?'cross':'local'}">${isCross?'CROSS-ZONA':'LOCAL'}</span>`;
    div.innerHTML = `
      <span class="evt-icon">${icon}</span>
      <span class="evt-body">
        <span class="evt-attacker">Héroe #${evt.attacker+1}</span>
        → <span class="evt-target">Héroe #${evt.target+1}</span>
        &nbsp;<span class="evt-dmg">-${evt.damage} HP</span>
        ${routeLabel}
        ${isKill ? ' <span style="color:var(--red2)">ELIMINADO</span>' : ''}
        <br>
        <span style="color:var(--text2)">celda (${evt.target_row},${evt.target_col})</span>
      </span>
      <span class="evt-tick">t${evt.tick}</span>`;
    feed.insertBefore(div, feed.firstChild);
  });

  // Mantener máximo 30 eventos visibles
  while (feed.children.length > 30) feed.removeChild(feed.lastChild);
}

// ─── Utilidades ───────────────────────────────────────────────
function setText(id, val) {
  const el = document.getElementById(id);
  if (el) el.textContent = val;
}
function flashEl(id) {
  const el = document.getElementById(id);
  if (!el) return;
  el.classList.add('flash');
  setTimeout(() => el.classList.remove('flash'), 400);
}

// ─── Init ─────────────────────────────────────────────────────
connect();
</script>
</body>
</html>
