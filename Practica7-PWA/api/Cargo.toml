[package]
name = "dungeon-api"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.7", features = ["json"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
colored = "2"
once_cell = "1"
dotenvy = "0.15"
rand = "0.8"
tower-http = { version = "0.5", features = ["cors"] }